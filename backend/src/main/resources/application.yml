server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: hirematch-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hirematchai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

app:
  jwt:
    secret: HireMatchAiSuperSecretJwtKey2026WithSufficientEntropyAndStrength!
    expiration-ms: 604800000
  upload:
    dir: ./uploads/resumes
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

logging:
  level:
    com.hirematch: INFO
    org.springframework.web: INFO
